<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2S Saint-Malo - Inscription au repas de la Route du Rhum</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        b2sBurgundy: '#4A1525',
                        b2sRose: '#D946EF',
                        b2sDark: '#2C0D16'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- En-tête responsive -->
    <header class="bg-b2sBurgundy text-white shadow-md py-4 sm:py-6 px-3 sm:px-4">
        <div class="max-w-7xl mx-auto flex flex-col lg:flex-row items-center justify-between gap-4 lg:gap-6">
            
            <!-- Logo de gauche -->
            <div class="flex-shrink-0">
                <img src="rhumlogo.png" alt="Logo Route du Rhum" class="h-24 sm:h-36 md:h-44 lg:h-52 object-contain rounded shadow-sm bg-white/10 p-1" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x200/4A1525/FFFFFF?text=Rhum';">
            </div>

            <!-- Centre : Titre, Date et Compteurs -->
            <div class="flex-grow flex flex-col items-center text-center w-full">
                <h1 class="text-lg sm:text-xl md:text-2xl font-bold tracking-wide">Repas Mensuel des Membres</h1>
                <p id="event-date" class="text-b2sRose font-medium mt-1 text-sm sm:text-base md:text-lg mb-3 sm:mb-4"></p>
                
                <div class="grid grid-cols-4 gap-2 sm:gap-4 w-full max-w-md justify-items-center">
                    <div class="flex flex-col items-center bg-white/15 backdrop-blur-sm border border-white/20 rounded-full w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 justify-center shadow-inner">
                        <span id="stat-presents" class="text-base sm:text-xl md:text-2xl font-extrabold text-green-300">0</span>
                        <span class="text-[9px] sm:text-[11px] md:text-xs uppercase tracking-wider text-slate-200">Présents</span>
                    </div>
                    <div class="flex flex-col items-center bg-white/15 backdrop-blur-sm border border-white/20 rounded-full w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 justify-center shadow-inner">
                        <span id="stat-guests" class="text-base sm:text-xl md:text-2xl font-extrabold text-pink-300">0</span>
                        <span class="text-[9px] sm:text-[11px] md:text-xs uppercase tracking-wider text-slate-200">Invités</span>
                    </div>
                    <div class="flex flex-col items-center bg-b2sRose/40 backdrop-blur-sm border border-b2sRose rounded-full w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 justify-center shadow-lg">
                        <span id="stat-total-repas" class="text-base sm:text-xl md:text-2xl font-extrabold text-white">0</span>
                        <span class="text-[9px] sm:text-[11px] md:text-xs uppercase tracking-wider text-white font-semibold">Total</span>
                    </div>
                    <div class="flex flex-col items-center bg-white/15 backdrop-blur-sm border border-white/20 rounded-full w-16 h-16 sm:w-20 sm:h-20 md:w-24 md:h-24 justify-center shadow-inner">
                        <span id="stat-absents" class="text-base sm:text-xl md:text-2xl font-extrabold text-red-300">0</span>
                        <span class="text-[9px] sm:text-[11px] md:text-xs uppercase tracking-wider text-slate-200">Absents</span>
                    </div>
                </div>
            </div>

            <!-- Logo de droite -->
            <div class="flex-shrink-0">
                <img src="NEW LOGO B2S.jpg" alt="Logo B2S Saint-Malo" class="h-24 sm:h-36 md:h-44 lg:h-52 object-contain rounded shadow-sm bg-white/10 p-1" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x200/4A1525/FFFFFF?text=B2S';">
            </div>

        </div>
    </header>

    <!-- Contenu Principal -->
    <main class="max-w-4xl mx-auto px-3 sm:px-4 py-6 sm:py-8 w-full flex-grow">

        <!-- Espace Administrateur -->
        <div class="flex justify-end mb-4">
            <div id="admin-trigger-box">
                <button onclick="toggleAdminLogin()" class="text-xs text-b2sRose hover:underline font-medium">🔑 Espace Administrateur</button>
            </div>
            <div id="admin-active-box" class="hidden flex items-center gap-3">
                <span class="bg-b2sRose text-white text-xs px-2.5 py-1 rounded-full font-semibold">Mode Admin Actif</span>
                <button onclick="exitAdmin()" class="bg-slate-200 text-slate-700 hover:bg-slate-300 text-xs px-3 py-1.5 rounded-lg font-medium transition-colors">Quitter Admin</button>
            </div>
        </div>

        <!-- Formulaire de Connexion Admin -->
        <div id="admin-login-box" class="bg-white rounded-xl shadow-md p-4 sm:p-6 mb-6 border border-slate-100 hidden">
            <h2 class="text-base sm:text-lg font-semibold text-b2sBurgundy mb-3">Connexion Administrateur</h2>
            <div class="flex flex-col gap-3">
                <input type="password" id="admin-password" placeholder="Mot de passe administrateur" class="p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-b2sRose focus:outline-none text-sm sm:text-base">
                <div class="flex gap-2">
                    <button onclick="checkAdmin()" class="flex-grow bg-b2sRose text-white px-6 py-3 rounded-lg font-medium hover:bg-pink-700 transition-colors text-sm sm:text-base">
                        Valider Admin
                    </button>
                    <button onclick="toggleAdminLogin()" class="bg-slate-200 text-slate-700 px-4 py-3 rounded-lg text-sm">Fermer</button>
                </div>
            </div>
            <p id="admin-error" class="text-red-500 text-sm mt-2 hidden">Mot de passe incorrect.</p>
        </div>

        <!-- Formulaire de Réponse Individuel -->
        <section id="form-section" class="bg-white rounded-xl shadow-md p-4 sm:p-6 mb-6 sm:mb-8 border border-slate-100 hidden">
            <div class="flex justify-between items-center mb-4 sm:mb-6 pb-3 border-b border-slate-100">
                <h2 id="welcome-member" class="text-lg sm:text-xl font-bold text-b2sBurgundy"></h2>
                <a href="index.html" class="text-xs sm:text-sm text-slate-500 hover:text-b2sBurgundy underline">Voir la vue générale</a>
            </div>

            <form id="rsvp-form" onsubmit="submitRsvp(event)" class="space-y-6">
                <div>
                    <label class="block font-medium text-slate-700 mb-2 text-sm sm:text-base">Serez-vous présent(e) ? *</label>
                    <div class="flex flex-row items-center gap-8">
                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="radio" name="attendance" value="Présent" required onclick="toggleGuests(true)" class="w-4 h-4 text-b2sRose focus:ring-b2sRose">
                            <span class="font-medium text-green-700 text-sm sm:text-base">Présent(e)</span>
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer select-none">
                            <input type="radio" name="attendance" value="Absent" required onclick="toggleGuests(false)" class="w-4 h-4 text-b2sRose focus:ring-b2sRose">
                            <span class="font-medium text-red-600 text-sm sm:text-base">Absent(e)</span>
                        </label>
                    </div>
                </div>

                <div id="guests-container" class="space-y-4 p-4 bg-slate-50 rounded-lg border border-slate-200 hidden">
                    <label class="flex items-center gap-3 cursor-pointer">
                        <input type="checkbox" id="has-guests" onchange="toggleGuestCount()" class="w-5 h-5 text-b2sRose rounded focus:ring-b2sRose">
                        <span class="font-medium text-slate-700 text-sm sm:text-base">Je suis accompagné(e) par des invité(e)s</span>
                    </label>

                    <div id="guest-count-box" class="hidden pl-6 pt-2">
                        <label class="block text-xs sm:text-sm font-medium text-slate-600 mb-1">Nombre d'invité(e)(s) supplémentaire(s) :</label>
                        <input type="number" id="guest-number" min="1" max="10" value="1" class="w-32 p-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-b2sRose focus:outline-none text-sm sm:text-base">
                        <p class="text-xs text-slate-500 mt-1">Tarif : Facturation du repas en plus par personne invitée.</p>
                    </div>
                </div>

                <div>
                    <label for="comment" class="block font-medium text-slate-700 mb-2 text-sm sm:text-base">Commentaires / Régimes alimentaires / Remarques :</label>
                    <textarea id="comment" rows="3" placeholder="Laissez un commentaire ici..." class="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-b2sRose focus:outline-none text-sm sm:text-base"></textarea>
                </div>

                <div class="flex flex-col sm:flex-row gap-3">
                    <button type="submit" class="flex-grow bg-b2sRose text-white py-3 rounded-lg font-semibold hover
